[pytest]
# ─── Directorio de tests ───────────────────────────────────────────────────────
testpaths = tests

# ─── Prefijos de archivos y funciones ─────────────────────────────────────────
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ─── Opciones por defecto ─────────────────────────────────────────────────────
addopts =
    --tb=auto

# ─── Marcadores personalizados ────────────────────────────────────────────────
# Uso: @pytest.mark.lento para tests de integración pesados
markers =
    lento: Tests de integración que tardan más de 1 segundo
    critico: Tests cuyo fallo bloquea el deploy
    rbac: Tests relacionados con control de acceso por roles

# ─── Variables de entorno para test ──────────────────────────────────────────
# (también manejadas por run_tests.sh, aquí como fallback)
env =
    TESTING=1
